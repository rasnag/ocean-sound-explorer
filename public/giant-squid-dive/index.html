<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Giant Squid Dive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen deep-sea game. A tall "porthole" stage on top, picture controls below, one grown-up prompt strip. Single committed dark look. */
:root{
  --abyss:#050d1c;
  --deep:#0b1f3a;
  --panel:#13304f;
  --glow:#5ef2d6;
  --squid:#d4553f;
  --sub:#ffc93c;
  --foam:#eef7ff;
  --ink:#0c1626;
  --muted:#9fb6cf;
  --ok:#43c26b;
  --display:"Fredoka", ui-rounded, "Trebuchet MS", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--abyss);color:var(--foam);font-family:var(--display);margin:0;overflow-x:hidden}
.app{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;box-sizing:border-box;gap:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 20px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:1.5rem;font-weight:700;line-height:1.1;text-wrap:balance}
.lvl{font-size:.85rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--panel);border-radius:999px;padding:4px 10px;white-space:nowrap}
.lvl:empty{display:none}

.stage{position:relative;border-radius:28px;overflow:hidden;min-height:320px;flex:0 0 auto;
  background:linear-gradient(#123a63,#061428);transition:background 1s ease}
.stage.d100{background:linear-gradient(#7fd3f0,#2a8cc0)}
.stage.d700{background:linear-gradient(#0c2d52,#030b18)}
.stage.d4000{background:linear-gradient(#030a14,#000)}
.bubble{position:absolute;top:12px;left:12px;right:12px;z-index:5;background:var(--foam);color:var(--ink);border-radius:20px;
  padding:10px 14px;font-size:1.15rem;font-weight:600;line-height:1.25;text-align:center}
.bubble:empty{visibility:hidden}
.tag{display:inline-block;margin-top:4px;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:1px 6px;background:#d8f5ea;color:#11573f}
.scene{position:absolute;inset:0}
.floor{position:absolute;left:0;right:0;bottom:0;height:16%;background:#2a2620;border-top:3px solid #3a352d;display:none}
.stage.d4000 .floor{display:block}
.sunrays{position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.12) 0 18px,transparent 18px 60px);display:none}
.stage.d100 .sunrays{display:block}
.snow{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 1px,transparent 1.5px);background-size:22px 26px;opacity:.5}
#sub{position:absolute;left:50%;top:22%;width:120px;transform:translateX(-50%);transition:top 1.4s ease-in-out;z-index:3}
#sub.diving{top:34%}
.beam{position:absolute;left:50%;top:calc(22% + 40px);width:0;height:0;transform:translateX(-50%);z-index:2;transition:top 1.4s ease-in-out;
  border-left:90px solid transparent;border-right:90px solid transparent;border-top:170px solid rgba(255,255,255,.28);filter:blur(2px)}
.beam.red{border-top-color:rgba(255,60,50,.22)}
.beam.off{display:none}
.diving~.beam,.beam.down{top:calc(34% + 40px)}
#lure{position:absolute;left:50%;top:62%;width:18px;height:18px;margin-left:-9px;border-radius:50%;z-index:3;background:#bff;box-shadow:0 0 14px 6px var(--glow),0 0 30px 14px rgba(94,242,214,.4);animation:flash .5s ease-in-out infinite alternate}
@keyframes flash{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
#bigsquid{position:absolute;bottom:-4%;right:-40%;width:62%;z-index:1;opacity:0;transition:right 1.6s ease-out,opacity 1.2s ease}
#bigsquid.show{right:4%;opacity:1}
#fishes{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .4s}
#fishes span{position:absolute;font-size:1.6rem;transition:transform 1.1s ease-in}
#fishes span:nth-child(1){left:18%;top:58%}#fishes span:nth-child(2){left:68%;top:52%}#fishes span:nth-child(3){left:40%;top:72%}#fishes span:nth-child(4){left:78%;top:70%}
#fishes.show{opacity:1}
#fishes.flee span:nth-child(odd){transform:translateX(-260px)}#fishes.flee span:nth-child(even){transform:translateX(260px)}
.result-chip{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:5;background:rgba(5,13,28,.85);border:2px solid var(--glow);color:var(--foam);
  border-radius:999px;padding:4px 14px;font-weight:700;white-space:nowrap}
.result-chip:empty{display:none}

/* look round */
.look-stage{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:4%;padding:104px 10px 12px;box-sizing:border-box}
.look-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.look-col svg{width:auto;max-width:100%;height:auto;max-height:190px}
.stage.looking{min-height:360px}
.look-col .cap{font-size:.95rem;font-weight:700;background:rgba(5,13,28,.75);border-radius:999px;padding:2px 10px}
.scale{font-size:.9rem;color:var(--muted);text-align:center}

.hint{background:var(--panel);border-radius:16px;padding:9px 12px;font-size:.98rem;font-weight:500;line-height:1.3}
.hint b{color:var(--sub);letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;margin-right:6px}
.seg{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.seg-label{font-size:.85rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.seg-row{display:flex;gap:8px}
.seg-btn{appearance:none;border:0;flex:1 1 0;min-width:0;border-radius:16px;padding:8px 6px;font-family:var(--display);font-size:1rem;font-weight:600;line-height:1.15;
  background:var(--panel);color:var(--foam);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.seg-btn span{font-size:1.7rem;line-height:1}
.seg-btn small{font-size:.78rem;color:var(--muted);font-weight:500}
.seg-btn[aria-pressed="true"]{background:var(--sub);color:var(--ink)}
.seg-btn[aria-pressed="true"] small{color:#5a4a10}
.seg.locked .seg-btn{opacity:.4;cursor:default}
.seg.flag{outline:3px dashed var(--sub);outline-offset:4px;border-radius:16px}
.lockchip{font-size:.78rem;letter-spacing:0;text-transform:none;color:var(--sub)}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tray.two{grid-template-columns:repeat(2,1fr)}
.choice{appearance:none;border:0;border-radius:20px;background:var(--foam);color:var(--ink);font-family:var(--display);font-size:2.3rem;line-height:1;
  padding:12px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 rgba(0,0,0,.45)}
.choice small{font-size:.92rem;font-weight:600}
.choice:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.choice:focus-visible,.seg-btn:focus-visible,.btn:focus-visible{outline:4px solid var(--glow);outline-offset:3px}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{appearance:none;border:0;border-radius:999px;padding:13px 22px;font-family:var(--display);font-size:1.15rem;font-weight:700;background:var(--sub);color:var(--ink);
  cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.45);flex:1 1 auto;text-align:center;text-decoration:none;display:block}
.btn.ghost{background:transparent;color:var(--foam);box-shadow:inset 0 0 0 2px var(--foam)}
.btn.wa{background:#25d366;color:#06301a;font-size:1.25rem;padding:16px 22px}
.card{background:var(--foam);color:var(--ink);border-radius:20px;padding:14px 16px;font-size:1rem;line-height:1.45}
.card h2{margin:0 0 6px;font-size:1.15rem}
.fr{display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid #d9e3ee}
.fr:last-child{border-bottom:0}
.fr b{text-align:right}
.fr small{grid-column:1/-1;text-align:right;color:#4d5d70;font-size:.85rem}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid #d9e3ee;white-space:nowrap}
th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:#4d5d70}
.note-in{width:100%;box-sizing:border-box;margin-top:8px;border:2px solid #c9d6e4;border-radius:14px;padding:10px 12px;font-family:var(--display);font-size:1rem;color:var(--ink);background:#fff;resize:vertical;min-height:64px}
.end-label{display:block;font-weight:700}
.peek summary{cursor:pointer;font-weight:600}
.plays-info{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;font-size:.9rem;margin-top:8px;color:var(--muted)}
.link-btn{appearance:none;border:0;background:none;color:var(--foam);font-family:var(--display);font-size:.9rem;font-weight:600;text-decoration:underline;cursor:pointer;padding:4px 0}
.mission{font-size:1rem;line-height:1.45}
.real .btn{font-size:1.05rem}
.opens{margin:6px 0 0;font-size:.8rem;color:#4d5d70;text-align:center}
.btn.ghost.dark{color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);font-size:1rem}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.steps li span{font-size:1.6rem;line-height:1}
.shadow-wrap{position:relative;display:flex;justify-content:center;height:165px}
.shadow-wrap svg{height:165px;width:110px;max-height:none;opacity:.95;filter:blur(1.2px)}
.murk{position:absolute;left:50%;top:38%;width:190px;height:130px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(4,12,26,.97),rgba(4,12,26,.85) 60%,rgba(4,12,26,0));filter:blur(4px)}
.shadow-q{position:absolute;top:22%;left:50%;transform:translate(-50%,-50%);font-size:3.2rem;font-weight:700;color:var(--glow);text-shadow:0 0 18px rgba(94,242,214,.7)}
.slots{display:flex;gap:8px;margin-top:4px}
.slot{background:rgba(5,13,28,.75);border:2px dashed var(--muted);border-radius:12px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;min-width:54px}
.slot.filled{border-style:solid;border-color:var(--glow)}
.slot span{font-size:1.3rem;line-height:1.1}
.slot small{font-size:.72rem;color:var(--muted);font-weight:600}
.mission li{margin:4px 0}
.levelup{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header>
    <h1 id="title">Giant Squid Dive</h1>
    <span class="lvl" id="lvl"></span>
  </header>
  <div class="stage" id="stage">
    <div class="scene">
      <div class="sunrays"></div><div class="snow"></div><div class="floor"></div>
    </div>
    <div id="look" class="look-stage" hidden></div>
    <div id="dive" hidden>
      <svg id="sub" viewBox="0 0 120 70" aria-hidden="true">
        <rect x="56" y="4" width="20" height="18" rx="5" fill="#e0a92a"/>
        <ellipse cx="58" cy="40" rx="50" ry="24" fill="#ffc93c" stroke="#9a6d0c" stroke-width="3"/>
        <circle cx="44" cy="40" r="9" fill="#7fe0ff" stroke="#9a6d0c" stroke-width="3"/>
        <circle cx="70" cy="40" r="9" fill="#7fe0ff" stroke="#9a6d0c" stroke-width="3"/>
        <path d="M8 40 l-6 -10 v20z" fill="#e0a92a"/>
        <rect x="100" y="34" width="12" height="12" rx="3" fill="#fff6c8"/>
      </svg>
      <div class="beam" id="beam"></div>
      <div id="lure" hidden></div>
      <div id="bigsquid" aria-hidden="true"></div>
      <div id="fishes" aria-hidden="true"><span>🐟</span><span>🐠</span><span>🐟</span><span>🐟</span></div>
    </div>
    <div class="bubble" id="bubble" aria-live="polite"></div>
    <div class="result-chip" id="chip"></div>
  </div>
  <div class="hint" id="hint"></div>
  <div id="controls"></div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const stage=$("stage"),bubble=$("bubble"),hint=$("hint"),controls=$("controls");
const CHILD="Alex";

/* ---------- squid drawing ---------- */
function squidSVG(o){
  const arms=o.arms===0?0:(o.arms||10),eye=o.eye||"plate",col=o.color||"#d4553f",dark=o.dark||"#8f2f22";
  const er={tiny:4,yours:8,plate:17}[eye];
  let s='<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">';
  s+='<path d="M100 8 C130 20 140 60 138 110 L62 110 C60 60 70 20 100 8Z" fill="'+col+'" stroke="'+dark+'" stroke-width="3"/>';
  s+='<path d="M100 8 C78 2 58 14 52 34 C70 34 88 26 100 20 C112 26 130 34 148 34 C142 14 122 2 100 8Z" fill="'+col+'" stroke="'+dark+'" stroke-width="3"/>';
  s+='<path d="M80 50 q20 8 40 0 M78 75 q22 8 44 0" stroke="'+dark+'" stroke-width="2" fill="none" opacity=".5"/>';
  s+='<ellipse cx="100" cy="122" rx="40" ry="18" fill="'+col+'" stroke="'+dark+'" stroke-width="3"/>';
  if(eye!=="none")[76,124].forEach(x=>{s+='<circle cx="'+x+'" cy="120" r="'+(er+4)+'" fill="#fff" stroke="'+dark+'" stroke-width="2"/><circle cx="'+(x+1)+'" cy="121" r="'+er+'" fill="#10131c"/><circle cx="'+(x-er*.3)+'" cy="'+(120-er*.35)+'" r="'+Math.max(1.5,er*.25)+'" fill="#fff"/>'});
  const shortArms=arms===10?8:arms, n=shortArms;
  for(let i=0;i<n;i++){
    const t=n===1?.5:i/(n-1),x0=70+t*60,x1=40+t*120,len=90+Math.sin(t*Math.PI)*30;
    s+='<path d="M'+x0+' 135 C'+(x0+(t-.5)*30)+' '+(135+len*.4)+' '+(x1-(t-.5)*20)+' '+(135+len*.7)+' '+x1+' '+(135+len)+'" stroke="'+col+'" stroke-width="9" fill="none" stroke-linecap="round"/>';
  }
  if(arms===10){
    [[88,26],[112,174]].forEach(([x0,x1],k)=>{
      s+='<path d="M'+x0+' 136 C'+(x0+(k?20:-20))+' 200 '+(x1+(k?10:-10))+' 240 '+(k?186:14)+' 286" stroke="'+col+'" stroke-width="5" fill="none" stroke-linecap="round"/>';
      s+='<ellipse cx="'+(k?186:14)+'" cy="284" rx="9" ry="14" fill="'+col+'" stroke="'+dark+'" stroke-width="2"/>';
    });
  }
  return s+'</svg>';
}

/* ---------- facts & content ---------- */
const LOOK=[
  {key:"size",clue:"Sperm whales eat giant squid. A sperm whale is even longer than a school bus!",ask:"How long do you think a giant squid is?",real:"bus",pic:"whale",
   opts:[{id:"cat",e:"🐈",name:"Like a cat"},{id:"car",e:"🚗",name:"Like a car"},{id:"bus",e:"🚌",name:"Like a school bus"}],
   fact:"As long as a school bus! Up to about 13 metres, counting the long tentacles."},
  {key:"eye",clue:"Giant squid live deep in the sea, where it is very, very dark.",ask:"What do you think its eyes are like?",real:"plate",pic:"dark",
   opts:[{id:"tiny",e:"🟢",name:"Tiny, like a pea"},{id:"yours",e:"👁️",name:"Like yours"},{id:"plate",e:"🍽️",name:"Big as a plate"}],
   fact:"As big as a dinner plate! Some animals in the dark have tiny eyes, like cave fish. The giant squid has huge ones, about 30 cm across, to catch every bit of light."},
  {key:"arms",clue:"This is an octopus. It has 8 arms. A squid is a lot like an octopus.",ask:"How many arms do you think a squid has?",real:"arms10",pic:"octopus",
   opts:[{id:"arms6",e:"6️⃣",name:"6 arms",val:6},{id:"arms8",e:"8️⃣",name:"8 arms",val:8},{id:"arms10",e:"🔟",name:"10 arms",val:10}],
   fact:"10! It has 8 arms like an octopus, plus 2 extra-long tentacles for grabbing food."}
];
function whaleBus(){
  const s=300/16,x=30;
  return '<svg viewBox="0 0 360 150" style="width:100%;max-width:340px;height:auto" role="img" aria-label="A sperm whale is longer than a school bus">'+
    '<path d="M'+x+' 50 q0 -28 40 -30 h'+(13*s-40)+' q30 0 40 22 l'+(2.2*s)+' -16 l-'+(0.6*s)+' 24 l'+(0.6*s)+' 24 l-'+(2.2*s)+' -16 q-10 22 -40 22 h-'+(13*s-40)+' q-40 -2 -40 -30z" fill="#5c7a99"/>'+
    '<circle cx="'+(x+24)+'" cy="44" r="3" fill="#0b1f3a"/>'+
    '<text x="'+(x+80)+'" y="56" fill="#eef7ff" font-size="14" font-weight="700" font-family="Fredoka, sans-serif">Sperm whale</text>'+
    '<rect x="'+x+'" y="96" width="'+(12*s)+'" height="40" rx="7" fill="#ffc93c"/>'+
    Array.from({length:7},(_,i)=>'<rect x="'+(x+10+i*30)+'" y="102" width="22" height="14" rx="3" fill="#7fe0ff"/>').join("")+
    '<circle cx="'+(x+35)+'" cy="138" r="8" fill="#222"/><circle cx="'+(x+12*s-35)+'" cy="138" r="8" fill="#222"/>'+
    '<text x="'+(x+12*s+8)+'" y="122" fill="#eef7ff" font-size="14" font-weight="700" font-family="Fredoka, sans-serif">Bus</text></svg>';
}
function lookPic(kind){
  if(kind==="whale")return whaleBus();
  if(kind==="octopus")return '<div style="font-size:6rem;line-height:1">🐙</div><div class="cap">Octopus: 8 arms</div>';
  return shadowSquid();
}
const VARS={
  ocean:{label:"Ocean",fixed:"japan",opts:[{id:"japan",e:"🗾",name:"Warm sea",sub:"near Japan"},{id:"ice",e:"🧊",name:"Icy sea",sub:"near Antarctica"}]},
  depth:{label:"How deep",fixed:"d700",opts:[{id:"d100",e:"☀️",name:"Sunny",sub:"100 m"},{id:"d700",e:"🌑",name:"Dark middle",sub:"700 m"},{id:"d4000",e:"⬛",name:"Sea floor",sub:"4,000 m"}]},
  light:{label:"Sub light",fixed:"red",opts:[{id:"white",e:"💡",name:"Bright white"},{id:"red",e:"🔴",name:"Dim red"}]},
  lure:{label:"Lure",fixed:"glow",opts:[{id:"none",e:"⭕",name:"Nothing"},{id:"glow",e:"✨",name:"Glowing jelly"}]}
};
const LEVELS=[
  {n:1,animal:"giant",vars:["depth"],intro:"Mission 1: find a giant squid! Choose how deep to dive."},
  {n:2,animal:"giant",vars:["depth","light"],intro:"Mission 2: now you choose the sub's light too."},
  {n:3,animal:"giant",vars:["depth","light","lure"],intro:"Mission 3: depth, light and a lure. Can you call the squid over?"},
  {n:4,animal:"colossal",vars:["ocean","depth","light","lure"],intro:"Expert mission: find the COLOSSAL squid, the heaviest squid of all!"}
];
const NEED={giant:{ocean:"japan",depth:"d700",light:"red",lure:"glow"},colossal:{ocean:"ice",depth:"d700",light:"red",lure:"glow"}};
const WHY={
  ocean:"Only small fish came. Colossal squid like very, very cold water.",
  d100:"Only small fish here in the sunny water! Giant squid live down where it's dark.",
  d4000:"Only a few small fish on the sea floor. Squid swim higher up, in the dark middle water.",
  light:"Whoosh! The bright light scared everything away!",
  lure:"Only small fish came. The squid didn't notice us. How could we call it over?"
};
const OUTCOMES=[{id:"squid",e:"🦑",name:"A squid comes!"},{id:"fish",e:"🐟",name:"Only small fish"},{id:"away",e:"💨",name:"Everything swims away"}];
function outcomeOf(prob){return !prob?"squid":prob==="light"?"away":"fish"}
const OUT_NAME={squid:"squid came",fish:"only small fish",away:"everything swam away"};
const REAL={
  giant:{url:"https://oceanexplorer.noaa.gov/video_playlist/best_5_squid.html",btn:"📷 Watch a real giant squid",cap:"Real video from NOAA: a giant squid swims up to a glowing lure, 759 m deep in the Gulf of Mexico (2019)."},
  colossal:{url:"https://thekidshouldseethis.com/post/a-young-colossal-squid-filmed-alive-in-its-natural-habitat-for-the-first-time",btn:"📷 Watch the real baby colossal squid",cap:"The first video ever of a living colossal squid: a see-through baby, 600 m deep near Antarctica (2025)."}
};
function realLink(kind){
  const r=REAL[kind],d=document.createElement("div");d.className="card real";d.style.marginTop="12px";
  d.innerHTML="<p style='margin:0 0 8px'>"+r.cap+"</p><a class='btn' id='real-"+kind+"' href='"+r.url+"' target='_blank' rel='noopener'>"+r.btn+"</a><p class='opens'>Opens in a new tab. Come back here to keep playing.</p>";
  d.querySelector("a").addEventListener("click",()=>{P.watched=P.watched||{};P.watched[kind]=true;keep()});
  return d;
}
const WHY_IT_WORKS={
  ocean:{e:"🧊",t:"Colossal squid live only in the freezing sea around Antarctica."},
  depth:{e:"🌑",t:"Sunlight fades fast in the sea. By 700 m it is almost dark, and that's where giant squid hunt."},

function longSquid(x,base,L,col){

  o+='<ellipse cx="'+mx+'" cy="'+cy+'" rx="'+(L*0.17)+'" ry="'+hh+'" fill="'+col+'"/>';
  o+='<circle cx="'+(x+L*0.31)+'" cy="'+cy+'" r="'+Math.max(1.4,L*0.022)+'" fill="#fff"/>';
  for(let i=0;i<6;i++){const dy=(i-2.5)*hh*0.35;o+='<path d="M'+(x+L*0.33)+' '+cy+' q'+(L*0.15)+' '+(dy*1.6)+' '+(L*0.3)+' '+dy+'" stroke="'+col+'" stroke-width="'+Math.max(1.2,L*0.012)+'" fill="none" stroke-linecap="round"/>'}
  [-1,1].forEach(k=>{o+='<path d="M'+(x+L*0.33)+' '+cy+' q'+(L*0.33)+' '+(k*hh*1.4)+' '+(L*0.64)+' '+(k*hh*0.5)+'" stroke="'+col+'" stroke-width="'+Math.max(0.8,L*0.006)+'" fill="none"/><ellipse cx="'+(x+L*0.97)+'" cy="'+(cy+k*hh*0.5)+'" rx="'+Math.max(1.5,L*0.03)+'" ry="'+Math.max(1,L*0.012)+'" fill="'+col+'"/>'});

/* ---------- round 2: dive missions with automatic levelling ---------- */
function startLevel(n){
  const def=LEVELS[n-1];
  L={n,def,set:{},tests:[],help:[],clarityAtStart:clarity};
  def.vars.forEach(v=>L.set[v]=null);
  Object.keys(VARS).forEach(v=>{if(!def.vars.includes(v))L.set[v]=VARS[v].fixed});
  $("look").hidden=true;$("dive").hidden=false;$("chip").textContent="";$("bigsquid").className="";
  $("title").textContent=def.animal==="colossal"?"Colossal Squid Dive":"Giant Squid Dive";
  $("lvl").textContent="Mission "+n+" of 4";$("lvl").classList.remove("levelup");void $("lvl").offsetWidth;$("lvl").classList.add("levelup");
  say(def.intro);
  setHint("Let "+CHILD+" choose. Before each dive, ask: “Will we find it? Why?”");
  paintDive();renderDive();
}
function paintDive(){
  const s=L.set;
  setStage(s.depth||"");
  if(s.ocean==="ice")stage.style.background=s.depth==="d100"?"linear-gradient(#bfe3f2,#5b9fbf)":s.depth==="d4000"?"linear-gradient(#020812,#000)":"linear-gradient(#123552,#02101e)";
  else stage.style.background="";
  const beam=$("beam");beam.className="beam"+(s.light==="red"?" red":s.light?"":" off")+($("sub").classList.contains("diving")?" down":"");
  $("lure").hidden=s.lure!=="glow";
}
function renderDive(flagVar){
  controls.innerHTML="";
  if(L.done)doneBlock();
  Object.keys(VARS).forEach(v=>{
    const open=L.def.vars.includes(v);
    if(!open&&v==="ocean")return;
    const V=VARS[v];
    const live=open&&!L.done;
    const wrap=document.createElement("div");wrap.className="seg"+(live?"":" locked")+(flagVar===v?" flag":"");
    wrap.innerHTML="<div class='seg-label'><span>"+V.label+"</span>"+(open?"":"<span class='lockchip'>🔒 set for you</span>")+"</div>";
    const r=document.createElement("div");r.className="seg-row";
    V.opts.forEach(o=>{const b=document.createElement("button");b.className="seg-btn";b.id=v+"-"+o.id;b.disabled=!live;
      b.setAttribute("aria-pressed",L.set[v]===o.id);b.innerHTML="<span>"+o.e+"</span>"+o.name+(o.sub?"<small>"+o.sub+"</small>":"");
      if(live)b.onclick=()=>{L.set[v]=o.id;$("bigsquid").className="";$("chip").textContent="";paintDive();renderDive()};
      r.appendChild(b)});
    wrap.appendChild(r);controls.appendChild(wrap);
  });
  const ready=L.def.vars.every(v=>L.set[v]);
  const g=document.createElement("div");g.className="seg";
  if(L.done){if(L.tests.length)controls.appendChild(diveTable());return}
  if(!ready){g.innerHTML="<div class='seg-label'><span>Pick one in each open row</span></div>"}
  else{
    g.innerHTML="<div class='seg-label'><span>What will happen? Pick, then we dive!</span></div>";
    const t=document.createElement("div");t.className="tray";
    OUTCOMES.forEach(o=>{const b=document.createElement("button");b.className="choice";b.id="dive-"+o.id;b.innerHTML=o.e+"<small>"+o.name+"</small>";b.onclick=()=>dive(o.id);t.appendChild(b)});
    g.appendChild(t);
  }
  controls.appendChild(g);
  if(L.tests.length)controls.appendChild(diveTable());
}
function problem(set,animal){
  const need=NEED[animal];
  for(const v of ["ocean","depth","light","lure"]){if(set[v]!==need[v])return v}
  return null;
}
function dive(guess){
  if(L.done||L.busy)return;L.busy=true;
  controls.querySelectorAll("button").forEach(b=>b.disabled=true);
  const prob=problem(L.set,L.def.animal);
  const prev=L.tests[L.tests.length-1];
  const changed=prev?L.def.vars.filter(v=>prev.set[v]!==L.set[v]):[];
  $("chip").textContent="";$("bigsquid").className="";$("fishes").className="";
  say("Diving... down, down, down...");
  $("sub").classList.add("diving");$("beam").classList.add("down");
  setTimeout(()=>{
    const fails=L.tests.filter(t=>t.prob).length+(prob?1:0);
    let flag=null;
    if(prob){
      // within-level help: switch to named feedback, then point at the row
      const key=prob==="depth"?L.set.depth:prob;
      if(clarity==="named")say(WHY[key]);else say("No squid this time. Something isn't right yet.");
      if(fails>=RULES.highlightAfter&&L.def.vars.includes(prob)){flag=prob;if(!L.help.includes("highlight"))L.help.push("highlight")}
      $("fishes").className=prob==="light"?"show flee":"show";
      $("chip").textContent=OUTCOMES.find(o=>o.id===outcomeOf(prob)).e+" "+OUT_NAME[outcomeOf(prob)];
    }else{
      const a=WIN[L.def.animal];
      $("bigsquid").innerHTML=squidSVG({arms:10,eye:"plate",color:L.def.animal==="colossal"?"#b8372d":"#d4553f"});
      requestAnimationFrame(()=>$("bigsquid").className="show");
      say(a.say,"Real fact");
      $("chip").textContent=L.def.animal==="colossal"?"Colossal squid found! 🦑":"Giant squid found! 🦑";
    }
    L.tests.push({set:{...L.set},guess,prob,outcome:outcomeOf(prob),changed,clarity});keep();
    setTimeout(()=>{
      $("sub").classList.remove("diving");$("beam").classList.remove("down");L.busy=false;
      if(!prob){levelDone();return}
      renderDive(flag);
      if(flag)setHint("Look at the flashing row. Ask: “What could we change here?”");
      else setHint("Ask: “What should we change?” Change one thing and dive again.");
    },1200);
  },1500);
}
function levelDone(){
  const t=L.tests.length;
  let pace=t<=RULES.fastMax?"fast":t>=RULES.slowMin?"slow":"steady";
  const before=clarity;
  // v5: each mission adds exactly one choice, and reasons are always shown (FEEDBACK-008)
  const rec={n:L.n,animal:L.def.animal,vars:L.def.vars.slice(),tests:L.tests,help:L.help,pace,clarityStart:L.clarityAtStart,clarityNext:clarity};
  P.levels.push(rec);P.reached=Math.max(P.reached,L.n);keep();
  L.done={pace,t};
  setHint(L.n<4?"Ask: “What did we change that made it work?”":"Ask: “Which was harder, the giant or the colossal squid? Why?”");
  renderDive();
  try{localStorage.setItem(LV_KEY,String(pace==="fast"?Math.min(4,L.n+1):L.n))}catch(e){}
}
function doneBlock(){
  const {pace,t}=L.done;

  realBox.innerHTML="<span class='tag'>Real fact</span><p style='margin:6px 0 0'>"+WIN[L.def.animal].real+"</p>";

  why.innerHTML="<h2>Why it worked</h2>"+L.def.vars.map(v=>"<div class='fr' style='grid-template-columns:auto 1fr'><span style='font-size:1.4rem'>"+WHY_IT_WORKS[v].e+"</span><span>"+WHY_IT_WORKS[v].t+"</span></div>").join("");
  controls.appendChild(why);
  if(L.def.animal==="colossal")controls.appendChild(realLink("colossal"));
  const msg=pace==="fast"?"Wow, found in "+t+(t===1?" dive":" dives")+"! Next mission adds one new choice.":
            pace==="slow"?"You kept trying and found it! Next mission adds one new thing.":"Found in "+t+" dives! Next mission adds one new thing.";
  const p=document.createElement("p");p.style.margin="10px 0 0";p.textContent=L.n<4?msg:"You finished every mission. Real deep-sea explorer!";
  controls.appendChild(p);

  if(L.n<4)r.appendChild(mkBtn("next-level",L.n===3?"Expert mission →":"Next mission →","",()=>startLevel(L.n+1)));
  r.appendChild(mkBtn("finish",L.n<4?"Stop here, we're done":"Finish →",L.n<4?"ghost":"",showEnd));

}

/* ---------- play summary (every play kept) ---------- */
const NAME=(v,id)=>{const o=VARS[v].opts.find(x=>x.id===id);return o.name.toLowerCase()+(o.sub&&v==="depth"?" "+o.sub:"")};
function playLines(p){
  const out=[];
  if(p.look&&p.look.arms){
    out.push("Guess the look: "+LOOK.map(f=>{const o=f.opts.find(x=>x.id===p.look[f.key]);return o?o.name.toLowerCase()+(p.look[f.key]===f.real?" ✓":" ✗"):"-"}).join(", ")+(p.look.right!=null?" ("+p.look.right+"/3)":""));
  }
  if(p.levels.length||p.startLevel>1)out.push("Started at mission "+p.startLevel);
  (p.levels||[]).forEach(l=>{
    out.push("Mission "+l.n+(l.animal==="colossal"?" (colossal)":"")+" · "+l.vars.length+" choice"+(l.vars.length>1?"s":"")+" · "+l.tests.length+" dive"+(l.tests.length>1?"s":"")+" · "+l.pace+(l.clarityStart==="vague"?" · sub didn't say what was wrong":"")+(l.help.length?" · help: "+l.help.join(", "):""));
    l.tests.forEach((t,i)=>out.push("  "+(i+1)+". "+l.vars.map(v=>NAME(v,t.set[v])).join(", ")+(t.outcome===undefined
      ?". Guessed "+(t.guess==="yes"?"we'd find it":"we wouldn't")+", "+(t.prob?"no squid ("+t.prob+")":"found!")+(((t.guess==="yes")===!t.prob)?" ✓":" ✗")
      :". Guessed "+(OUT_NAME[t.guess]||t.guess)+"; "+(t.prob?OUT_NAME[t.outcome]+" ("+t.prob+")":"found!")+(t.guess===t.outcome?" ✓":" ✗"))+(i?(t.changed.length?". Changed "+t.changed.join(" + "):". Changed nothing"):"")));
  });
  if(L&&p===P&&L.tests.length&&!P.levels.some(l=>l.n===L.n&&l.tests===L.tests)){
    out.push("Mission "+L.n+" (unfinished) · "+L.tests.length+" dives, no squid yet");
    L.tests.forEach((t,i)=>out.push("  "+(i+1)+". "+L.def.vars.map(v=>NAME(v,t.set[v])).join(", ")+", no squid ("+t.prob+")"+(i?(t.changed.length?". Changed "+t.changed.join(" + "):". Changed nothing"):"")));
  }
  if(p.watched)out.push("Watched real video: "+Object.keys(p.watched).join(", "));
  out.push("Highest mission finished: "+(p.reached||"none")+" of 4 · "+p.taps+(p.taps===1?" tap":" taps")+" · about "+Math.max(1,Math.round((p.secs||0)/60))+" min"+(p.finished?"":" · stopped before the end"));
  return out;
}
function whenText(ms){try{const d=new Date(ms);return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}catch(e){return""}}
function allPlays(){return P&&P.taps>0?plays.concat([P]):plays.slice()}
function summaryText(){
  const ps=allPlays();
  const out=["🦑 Giant Squid Dive: "+CHILD+"'s tries"+(ps.length>1?" · played "+ps.length+" times":"")];
  ps.forEach((p,i)=>{out.push("","PLAY "+(i+1)+" ("+whenText(p.at)+")",...playLines(p))});
  out.push("","Levelling: each mission adds one new choice; the sub always says what went wrong; after "+RULES.highlightAfter+" misses the row to change flashes. Pace labels: ≤"+RULES.fastMax+" dives fast, ≥"+RULES.slowMin+" slow.");
  const n=$("dad-note");if(n&&n.value.trim())out.push("","Grown-up's note: "+n.value.trim());
  return out.join("\n");
}
function refreshShare(){const t=summaryText();const s=$("summary");if(s)s.textContent=t;const w=$("wa");if(w)w.href="https://wa.me/?text="+encodeURIComponent(t);return t}

/* ---------- end ---------- */
function showEnd(){
  P.finished=true;P.secs=Math.round((Date.now()-P.at)/1000);
  try{localStorage.setItem(CUR_KEY,JSON.stringify(P))}catch(e){}
  $("dive").hidden=true;$("look").hidden=false;$("lvl").textContent="";$("chip").textContent="";stage.style.background="";setStage("d700 looking");
  $("title").textContent="Explorer Report";
  $("look").innerHTML='<div class="look-col levelup">'+squidSVG({arms:10,eye:"plate"})+'<div class="cap">Great diving, explorer!</div></div>';
  say("Now find the giant squid at home!");
  setHint("Do the at-home mission together, then type one thing "+CHILD+" said or asked.");
  controls.innerHTML="";
  const m=document.createElement("div");m.className="card mission";
  m.innerHTML="<h2>At-home mission</h2><ol style='margin:0;padding-left:1.2em'><li>🍽️ Hold up a dinner plate. That's how big the squid's eye is!</li><li>👣 Take 13 big grown-up steps down the hall. That's how long a giant squid can be.</li><li>🖐️ Hold up all 10 fingers. A giant squid has 10 arms: 8 arms and 2 long tentacles!</li></ol>";
  controls.appendChild(m);
  const rv=document.createElement("div");rv.className="card";rv.style.marginTop="12px";
  rv.innerHTML="<h2>Real squid videos</h2><div class='row' style='margin-top:4px'><a class='btn ghost dark' href='"+REAL.giant.url+"' target='_blank' rel='noopener'>📷 Giant squid</a><a class='btn ghost dark' href='"+REAL.colossal.url+"' target='_blank' rel='noopener'>📷 Colossal squid</a></div>";
  controls.appendChild(rv);
  const f=document.createElement("div");f.className="card";f.style.marginTop="12px";
  f.innerHTML="<h2>What "+CHILD+" did</h2>"+
    "<div class='fr'><span>Guessed the look</span><b>"+(P.look.right!=null?P.look.right+" of 3":"-")+"</b></div>"+
    "<div class='fr'><span>Missions finished</span><b>"+(P.reached||0)+" of 4</b></div>"+
    P.levels.map(l=>"<div class='fr'><span>Mission "+l.n+"</span><b>"+l.tests.length+" dive"+(l.tests.length>1?"s":"")+"</b><small>"+({fast:"Quick! Made the next one harder",steady:"Good pace",slow:"Took a few tries, so the sub kept explaining"})[l.pace]+"</small></div>").join("");
  controls.appendChild(f);
  const nb=document.createElement("div");nb.className="card";nb.style.marginTop="12px";
  nb.innerHTML="<label for='dad-note' class='end-label'>One thing "+CHILD+" said or asked (optional)</label><textarea id='dad-note' class='note-in' placeholder='e.g. What eats a colossal squid?'></textarea>";
  controls.appendChild(nb);
  $("dad-note").addEventListener("input",refreshShare);
  const n=allPlays().length;
  if(n>1){
    const info=document.createElement("div");info.className="plays-info";
    info.innerHTML="<span>The summary includes all "+n+" plays saved in this browser.</span>";
    const clr=document.createElement("button");clr.className="link-btn";clr.id="clear-plays";clr.textContent="Clear old plays";let armed=false;
    clr.onclick=()=>{if(!armed){armed=true;clr.textContent="Tap again to clear";return}plays=[];persist();clr.remove();info.querySelector("span").textContent="Old plays cleared. The summary shows this play only.";refreshShare()};
    info.appendChild(clr);controls.appendChild(info);
  }
  const det=document.createElement("div");det.className="card";det.style.marginTop="12px";
  det.innerHTML="<h2>Play summary</h2><p style='margin:0 0 6px;opacity:.85'>Every guess, try and change is recorded. In the Curiosity Loop pilot, families share this summary with us so the next game can build on it. (Demo: “Alex” is a placeholder name.)</p><pre id='summary' style='white-space:pre-wrap;font-family:inherit;margin:8px 0 0'></pre>";
  controls.appendChild(det);
  const c=mkBtn("copy","Copy","ghost",()=>{const t=refreshShare();const ok=()=>{c.textContent="Copied ✓"};
    try{navigator.clipboard.writeText(t).then(ok,()=>fallback(t,ok))}catch(e){fallback(t,ok)}});
  const a=mkBtn("again","Play again","ghost",()=>{plays.push(P);persist();try{localStorage.removeItem(CUR_KEY);savedStart=Math.min(4,Math.max(1,parseInt(localStorage.getItem(LV_KEY)||"1",10)||1))}catch(e){};L=null;clarity="named";startGame()});
  btnRow([c,a]);
  refreshShare();window.scrollTo(0,0);
}
function fallback(t,ok){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){}ta.remove()}

startGame();
})();
</script>
